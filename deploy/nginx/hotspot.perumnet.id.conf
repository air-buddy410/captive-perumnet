# Rate limit zones are shared by every server block in this deployment.
# limit_req_zone is only valid at http level, so install this file under
# /etc/nginx/conf.d/ (not sites-enabled) or move these two lines into
# /etc/nginx/conf.d/perumnet-limits.conf.
limit_req_zone $binary_remote_addr zone=perumnet_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=perumnet_admin:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name hotspot.perumnet.id;

    # Admin credentials were previously accepted over plaintext because this
    # block proxied the application directly instead of redirecting to TLS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hotspot.perumnet.id;

    ssl_certificate /etc/letsencrypt/live/hotspot.perumnet.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotspot.perumnet.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Defense in depth: the application now serves an explicit allowlist, but
    # keep the proxy from ever exposing the SQLite database, .env, or .git.
    location ~ /\. { deny all; }
    location ~ ^/(?:data|tests|node_modules|deploy|tmp|output)/ { deny all; }
    location ~ \.(?:mjs|db|ndjson|json|md|lock)$ { deny all; }

    location = /api/admin/login {
        limit_req zone=perumnet_admin burst=5 nodelay;
        include /etc/nginx/snippets/perumnet-proxy.conf;
    }

    location /api/auth/ {
        limit_req zone=perumnet_auth burst=10 nodelay;
        include /etc/nginx/snippets/perumnet-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/perumnet-proxy.conf;
    }
}

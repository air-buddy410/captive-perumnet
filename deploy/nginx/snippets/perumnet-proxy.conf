# NOT DEPLOYED - see ../hotspot.perumnet.id.conf. Shared upstream settings,
# install to /etc/nginx/snippets/perumnet-proxy.conf if nginx ever fronts the
# application. Note the app listens on the port set by PORT in .env, which is
# 3001 in production, not the 3000 default.
proxy_pass http://127.0.0.1:3001;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;

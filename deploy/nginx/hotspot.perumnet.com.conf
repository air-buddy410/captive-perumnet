# Zones are declared once in hotspot.perumnet.id.conf; both files must be loaded
# from the same http context for these zone names to resolve.

server {
    listen 80;
    listen [::]:80;
    server_name hotspot.perumnet.com;

    return 301 https://$host$request_uri;
}

# Cloudflare Tunnel connects to the existing .id TLS origin while preserving the
# public .com Host header.
#
# WARNING - certificate hostname mismatch. This block answers for
# hotspot.perumnet.com using the certificate issued for hotspot.perumnet.id.
# Cloudflare tolerates it on the origin hop, but any client reaching this host
# directly gets ERR_CERT_COMMON_NAME_INVALID. Fix by reissuing a certificate
# that covers both names:
#   certbot --nginx -d hotspot.perumnet.id -d hotspot.perumnet.com
# or by installing a Cloudflare Origin Certificate, then point the two
# ssl_certificate lines below at the new files.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hotspot.perumnet.com;

    ssl_certificate /etc/letsencrypt/live/hotspot.perumnet.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotspot.perumnet.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }
    location ~ ^/(?:data|tests|node_modules|deploy|tmp|output)/ { deny all; }
    location ~ \.(?:mjs|db|ndjson|json|md|lock)$ { deny all; }

    location = /api/admin/login {
        limit_req zone=perumnet_admin burst=5 nodelay;
        include /etc/nginx/snippets/perumnet-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/ {
        limit_req zone=perumnet_auth burst=10 nodelay;
        include /etc/nginx/snippets/perumnet-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        include /etc/nginx/snippets/perumnet-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }
}

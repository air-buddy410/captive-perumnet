# NOT DEPLOYED - see hotspot.perumnet.id.conf for why. nginx is not in the
# request path; Cloudflare Tunnel reaches the application directly.
#
# Zones are declared once in hotspot.perumnet.id.conf; both files must be loaded
# from the same http context for these zone names to resolve.

server {
    listen 80;
    listen [::]:80;
    server_name hotspot.perumnet.com;

    return 301 https://$host$request_uri;
}

# If this file is ever deployed, the certificate below must cover
# hotspot.perumnet.com. The .id certificate alone would fail hostname
# verification for any client that reaches the origin directly:
#   certbot --nginx -d hotspot.perumnet.id -d hotspot.perumnet.com
#
# This is not a live problem today. While the tunnel is in place, TLS is
# terminated by Cloudflare, and both hostnames are served by a valid
# certificate covering *.perumnet.id and *.perumnet.com respectively.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hotspot.perumnet.com;

    ssl_certificate /etc/letsencrypt/live/hotspot.perumnet.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotspot.perumnet.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }
    location ~ ^/(?:data|tests|node_modules|deploy|tmp|output)/ { deny all; }
    location ~ \.(?:mjs|db|ndjson|json|md|lock)$ { deny all; }

    location = /api/admin/login {
        limit_req zone=perumnet_admin burst=5 nodelay;
        include /etc/nginx/snippets/perumnet-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/ {
        limit_req zone=perumnet_auth burst=10 nodelay;
        include /etc/nginx/snippets/perumnet-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        include /etc/nginx/snippets/perumnet-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }
}
